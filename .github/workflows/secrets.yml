name: Secret Scanning

# Every push, on any branch: the repository is public, so a pushed branch already is.
# Every pull request, with no filter: "Secret Scanning" is a required check for main, and a
# skipped job would leave pull requests waiting for it.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same pattern as .githooks/pre-commit, for anything committed with --no-verify.
      - name: Refuse credential files
        run: |
          blocked=$(git ls-files |
            grep -E '(^|/)(\.env[^/]*|credentials\.json)$|(^|/)credentials/|\.(p12|jks|key|pem)$|(^|/)\.maestro/' |
            grep -v -E '\.(example|sample)$' || true)
          if [ -n "$blocked" ]; then
            echo "These files must not be committed:"
            echo "$blocked"
            exit 1
          fi

      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      # History reachable from this commit only, so a stale branch can't fail an unrelated run.
      # Findings are redacted: the logs of a public repository are public.
      - name: Scan history for secrets
        run: ./gitleaks git . --log-opts="${{ github.sha }}" --config .gitleaks.toml --redact --no-banner --verbose
